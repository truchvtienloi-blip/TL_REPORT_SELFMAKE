<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo</title>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="modulepreload" href="https://esm.sh/@lark-base-open/js-sdk@1.0.2">
<style>
:root{--ink:#1f2329;--muted:#646a73;--line:#dee0e3;--soft:#f5f6f7;--blue:#1f56a0;--blue-soft:#e9f0fa;--ok:#18a874;--err:#d92d20;--warn:#a65400;--warn-soft:#fff5e6}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f2f3f5}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:500}
button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--err)}button[aria-pressed=true],button.on{background:var(--blue-soft);border-color:#b9cbe6;color:var(--blue)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #cfd3d9;border-radius:6px;padding:5px 7px;background:#fff;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #1f56a080;outline-offset:1px}
[hidden]{display:none!important}
svg.i{width:15px;height:15px;flex:none;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line)}
.tl{display:flex;align-items:center;gap:8px;min-width:0}
.tabs{display:flex;gap:2px;background:#eef0f3;border-radius:8px;padding:2px}.tabs button{border:0;background:transparent;padding:4px 12px;border-radius:6px;color:#4b5563}.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#9aa4b2;flex:none}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.wait{background:#f5a623}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.sq{width:30px;height:30px;padding:0}
/* ---- thanh định dạng kiểu Excel ---- */
.ribbon{display:flex;align-items:stretch;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:4px 6px;gap:0;min-height:62px}
.rg{display:flex;flex-direction:column;justify-content:space-between;padding:2px 10px;border-right:1px solid #e6e8eb;gap:3px}
.rg:last-child{border-right:0}
.rr{display:flex;align-items:center;gap:3px;flex-wrap:nowrap}
.rc{font-size:10.5px;color:#8f959e;text-align:center;white-space:nowrap;line-height:1.2}.rc b{color:var(--ink);font-weight:600}
.rr select,.rr input{width:auto;padding:3px 5px;font-size:12.5px;height:28px}
.rr button{height:28px;min-width:28px;padding:0 5px;font-size:12.5px;border-color:transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rr button:hover{background:#f0f1f3;border-color:#e3e5e8}
.rr button[aria-pressed=true]{background:#dfe9f7;border-color:#b9cbe6;color:var(--blue)}
.cbtn{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:28px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px}
.cbtn:hover{background:#f0f1f3}.cbtn i{display:block;width:18px;height:4px;border-radius:1px;margin-top:1px;border:1px solid #0002}
.cbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.rg.off{opacity:.4;pointer-events:none}
.flist{max-height:320px;overflow:auto;border:1px solid #e8ebef;border-radius:8px;padding:2px}
.fitem{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;font-size:12.5px;cursor:pointer}.fitem:hover{background:#f5f7fa}.fitem input{width:auto;margin:0}.fitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fitem small{color:#9aa3b2;font-size:11px}
.menu .mi{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;padding:6px 10px 6px 6px;border-radius:6px;font-size:12.5px;position:relative;white-space:nowrap}
.menu .mi:hover,.menu .mi.open{background:#e9f0fa}.menu .mi .ck{width:16px;text-align:center;color:var(--blue);font-weight:700}.menu .mi .ar{margin-left:auto;padding-left:16px;color:#8f959e}
.menu .mi:disabled{opacity:.45}.menu .mh{font-size:11px;color:#8f959e;padding:4px 10px 2px 28px}
.menu{max-height:80vh;overflow:auto}
#rFont{width:140px}#rFs{width:54px}#rH{width:130px}#rG{width:100px}#rW{width:62px}
.layout{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
body.sidehid .layout{grid-template-columns:minmax(0,1fr)}body.sidehid .side{display:none}
.side{background:#fff;border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12px;font-weight:700;color:#373c43;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.sec h3::before{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #8f959e;transition:transform .15s}
.sec.collapsed h3::before{transform:rotate(-90deg)}.sec.collapsed>:not(h3){display:none!important}.sec.collapsed{gap:0}
.sec h3 .cnt{margin-left:auto;font-weight:500;color:#9aa3b2}
.lbl{font-size:12px;font-weight:500;color:#4b5563;display:flex;flex-direction:column;gap:3px}
.sub{font-size:11px;font-weight:600;color:#8f959e;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.row{display:flex;gap:6px;align-items:center}.row>*{flex:1;min-width:0}.row>.fit{flex:0 0 auto}
.hint{font-size:11.5px;color:var(--muted);margin:0;line-height:1.45}
.msg{padding:7px 9px;border-radius:6px;background:#f6f8fc;color:#526074;font-size:12px}.msg.ok{background:#ecfdf3;color:#067647}.msg.err{background:#fff1f0;color:var(--err)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}.chk input{width:auto;margin:0}
.ty{flex:0 0 18px;height:17px;border-radius:4px;background:#eef1f6;color:#5b6472;font:700 10px/17px Arial,sans-serif;text-align:center}.ty.num{background:#e9f0fa;color:var(--blue)}.ty.date{background:#e6f5ee;color:#0b7a50}.ty.calc{background:#fff1e0;color:#a65400;font-size:9px}
/* danh sách cột đã chọn */
.clist{display:flex;flex-direction:column;border:1px solid #e8ebef;border-radius:8px;overflow:hidden}
.citem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #f0f2f5;background:#fff;font-size:12.5px;cursor:pointer}
.citem:last-child{border-bottom:0}.citem:hover{background:#f7f9fc}.citem.on{background:var(--blue-soft)}
.citem .dh{cursor:grab;color:#b3bac6;display:inline-flex}.citem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem select{width:auto;padding:1px 3px;font-size:11.5px;height:22px;border-color:#e3e5e8;color:#4b5563}
.citem .x{border:0;background:none;padding:0 3px;color:#9aa3b2;height:22px}.citem .x:hover{color:var(--err)}
.citem.drop{box-shadow:inset 0 2px 0 var(--blue)}
.citem .mg{font-size:10px;color:var(--blue);background:#eef3fb;border-radius:4px;padding:0 4px}
.addlist{max-height:220px;overflow:auto;border:1px solid #e8ebef;border-radius:8px}
.aitem{display:flex;align-items:center;gap:7px;width:100%;border:0;border-bottom:1px solid #f4f5f7;border-radius:0;background:#fff;text-align:left;padding:5px 7px;font-size:12.5px}
.aitem:hover{background:#f7f9fc}.aitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.aitem .plus{color:var(--blue);font-weight:700}
/* cấp nhóm / sắp xếp / bộ lọc */
.lv{display:flex;flex-direction:column;gap:5px}
.lvrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:#f7f9fc;border:1px solid #e8ecf2;border-radius:7px;padding:4px}
.lvrow .n{flex:0 0 auto;font-weight:600;color:var(--muted);font-size:11.5px;padding:0 3px}
.lvrow select,.lvrow input{padding:3px 5px;font-size:12px;height:26px;flex:1 1 120px}
.lvrow .sm{flex:0 0 96px}
.lvrow button{padding:0 7px;height:26px;font-size:12px;flex:none}
.lvrow .x{border:0;background:none;color:#9aa3b2}.lvrow .x:hover{color:var(--err)}
.addbtn{border-style:dashed;color:var(--blue);font-size:12px;padding:4px 9px;align-self:flex-start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.seg button{border:0;border-radius:0;padding:4px 9px;border-right:1px solid var(--line);font-size:12px}.seg button:last-child{border-right:0}
.seg.full{display:flex}.seg.full button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{font-size:12px;padding:3px 9px;border-radius:999px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.vbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px}
.vbar .sep{width:1px;height:20px;background:#dfe2e6;margin:0 2px}
.vbar button{padding:4px 9px;font-size:12.5px}.vbar select,.vbar input{width:auto;padding:4px 7px;font-size:12.5px}
.stage{flex:1;min-height:0;overflow:auto;background:#e8ebef;padding:14px;position:relative}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;background:#fff;border-top:1px solid var(--line);padding:0 8px}
.ltabs{display:flex;gap:1px;align-items:stretch;align-self:stretch}
.ltabs button{border-radius:0;border:0;border-right:1px solid #eceef1;padding:4px 12px;font-size:12.5px;background:transparent;color:#4b5563}
.ltabs button.on{background:#f2f6fc;color:var(--blue);font-weight:600;box-shadow:inset 0 -2px 0 var(--blue)}
.ltabs .add{color:var(--blue)}
.sline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* bộ lọc người xem */
.fpanel{display:flex;flex-direction:column;flex:1;min-height:0}
.fhead{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.fbody{padding:10px 12px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto}
.fitm{display:flex;flex-direction:column;gap:4px}
.fitm>.t{font-size:12px;font-weight:600;color:#4b5563}.fitm>.t u{text-decoration:none;color:var(--blue);margin-right:4px}
.fitm .row input{padding:4px 6px;font-size:12px}
.msb{width:100%;text-align:left;padding:5px 24px 5px 8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-color:#cfd3d9}.msb::after{content:'▾';position:absolute;right:8px;color:#8f959e}
.msb.has{border-color:#9fbbe3;background:#f6f9fe;color:var(--blue)}
.ffoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:#fff}
.ffoot .pend{font-size:11.5px;color:var(--warn)}
#fvRun{height:36px;font-weight:600}
#fvRun.cancel{background:#fff;color:#b42318;border-color:#b42318}
#fvRun.cancel svg{display:none}
.pop{position:fixed;z-index:80;width:270px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #1b2b4a2e;padding:6px;display:flex;flex-direction:column;gap:5px}
.pop .pl{max-height:260px;overflow:auto;display:flex;flex-direction:column}
.pop label{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:12.5px;cursor:pointer}.pop label:hover{background:var(--soft)}.pop label input{width:auto;margin:0}.pop label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pop label small{color:#9aa3b2}
.pop .pa{display:flex;gap:4px}.pop .pa button{flex:1;font-size:12px;padding:4px}
.panel{position:fixed;z-index:82;width:320px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #1b2b4a2e;padding:12px;display:flex;flex-direction:column;gap:9px}
.panel h4{margin:0;font-size:13px}.panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.menu{position:fixed;z-index:85;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #1b2b4a2e;padding:4px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px}.menu button:hover{background:#f2f3f5}.menu hr{border:0;border-top:1px solid var(--line);margin:3px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:90;padding:14px}.modal.show{display:flex}
.card{background:#fff;border-radius:12px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0}.card pre{margin:0;background:var(--soft);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;user-select:text}
.card textarea{min-height:180px;font:12px ui-monospace,Consolas,monospace}.card .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2329;color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;z-index:95;display:none;max-width:90vw}.toast.show{display:block}
.needfix{outline:2px solid #d13438!important;outline-offset:2px;border-radius:6px}
/* ---- trang báo cáo ---- */
.rpt{--grid:#9aa0a6;background:#fff;color:#000;padding:16px 18px 22px;display:inline-block;min-width:100%;box-shadow:0 2px 10px #1b2b4a14}
.rpt .rh{margin:0 auto 10px}
.rpt .rt{line-height:1.3;outline:none}
.rpt .rs{line-height:1.4;outline:none;min-height:1em}
.rpt .rfl{font-weight:700;line-height:1.5;text-align:center}
.rpt .rn{line-height:1.45;outline:none;min-height:1em}.rpt.design .ph{color:#8b95a5}
.rpt .fz{position:sticky;z-index:1;background-color:#fff}.rpt th.fz{z-index:4}
.rpt table{border-collapse:separate;border-spacing:0;table-layout:fixed;margin:0}
.rpt .rline{line-height:1.45;position:relative;min-height:1.2em}.rpt .rline .lt{outline:none;display:inline-block;min-width:40px}
.rpt.design .rline{border-radius:3px}.rpt.design .rline:hover{box-shadow:0 0 0 1px #b9cbe6}
.rpt .lbar{position:absolute;right:0;top:50%;transform:translateY(-50%);display:none;gap:2px;font:12px Inter,Segoe UI,sans-serif;font-style:normal;font-weight:400}
.rpt.design .rline:hover .lbar,.rpt.design .rline:focus-within .lbar{display:inline-flex}
.rpt .lbar button{padding:1px 6px;font-size:11.5px;height:22px;display:inline-flex;align-items:center}
.rpt .laddbtn{display:block;margin:2px auto 6px;border:1px dashed #c9d2df;background:#fafbfd;color:#1f56a0;font:12px Inter,Segoe UI,sans-serif;padding:2px 10px;border-radius:6px}
.rpt .rbot{margin-top:6px}
.rpt.design .rline .lt:empty::before{content:'Gõ nội dung, hoặc bấm Chèn để thêm giá trị cột…';color:#9aa3b2;font-style:italic}
.rpt tr.hsrc th{background:#eef1f5!important;color:#7a8494;font:10.5px Inter,Segoe UI,sans-serif;font-weight:500;padding:1px 4px;border-top:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpt tr.hsrc+tr.h1 th{border-top:0}
.gbar{position:sticky;top:-14px;left:0;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-14px -14px 10px;padding:6px 14px;background:#f7f8fa;border-bottom:1px solid #dfe3e8;font-size:12px;color:#646a73}
.gbar.drop{background:#e9f0fa;box-shadow:inset 0 0 0 2px #1f56a066}
.gbar .gchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 9px;border-radius:999px;border:1px solid #c9d6ea;background:#fff;color:#1f2329;font-size:12px;cursor:pointer}
.gbar .gchip b{color:#1f56a0;font-weight:600}.gbar .gchip .x{border:0;background:none;padding:0 3px;height:18px;color:#9aa3b2}.gbar .gchip .x:hover{color:var(--err)}
.gbar .gsep{color:#b3bac6}.gbar .gopt{margin-left:auto;font-size:12px;padding:2px 9px}
.rpt th,.rpt td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:var(--pad,3px) 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.rpt tr>:first-child{border-left:1px solid var(--grid)}
.rpt thead tr:first-child th{border-top:1px solid var(--grid)}
.rpt th{white-space:normal;vertical-align:middle;position:sticky;top:0;z-index:2;overflow:visible}
.rpt th .hl{display:block;overflow:hidden;text-overflow:ellipsis}
.rpt td.w{white-space:normal}.rpt td.mg{vertical-align:middle;white-space:normal}
.rpt td.no{text-align:center;color:#555;white-space:nowrap;overflow:visible}
.rpt tr.gr td{cursor:pointer}.rpt tr.gr td:first-child{white-space:nowrap}
.rpt tr.gr .tg{display:inline-block;width:13px;height:13px;text-align:center;border:1px solid #8f959e;border-radius:2px;font:700 11px/11px Arial,sans-serif;color:#444;margin-right:5px;vertical-align:-1px;background:#fff}
.rpt.view tr.dr:hover td{background-image:linear-gradient(#fff3b0aa,#fff3b0aa)}
.rpt tr.zb td{background-image:linear-gradient(#00000008,#00000008)}
.rpt tr.more td{color:var(--muted);font-style:italic;text-align:center;background:#fafafa;padding:10px}
.rpt tr.more button{font-style:normal;margin-left:8px}
.rpt .rfoot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.rpt .rfoot>div{display:flex;flex-direction:column;gap:2px;min-height:70px}
.rpt .rfoot b,.rpt .rfoot i,.rpt .rfoot .rd{outline:none;min-height:1.2em;font-style:inherit;font-weight:inherit}
.rpt .rfoot b{font-weight:700}.rpt .rfoot i,.rpt .rfoot .rd{font-style:italic}
.rpt.design .demo{color:#6b7280}
.rpt.design th[data-ci],.rpt.design td[data-ci],.rpt.design tr.gr td,.rpt.design tr.tt td{cursor:pointer}
.rpt.design th.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.rpt.design td.sel{background-image:linear-gradient(#1f56a014,#1f56a014)}
.rpt.design .tsel{outline:2px solid #1f56a0aa;outline-offset:1px}
.rpt.design tr.tsel td{box-shadow:inset 0 2px 0 #1f56a0aa,inset 0 -2px 0 #1f56a0aa}
.rpt.design th.drop{box-shadow:inset 3px 0 0 #f08c00}
.rpt.design [contenteditable]{cursor:text;border-radius:3px}.rpt.design [contenteditable]:hover{box-shadow:0 0 0 1px #b9cbe6}.rpt.design [contenteditable]:focus{box-shadow:0 0 0 2px var(--blue)}
.rpt .grip{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:3}.rpt .grip:hover,.rpt .grip.drag{background:#1f56a066}
.dnote{display:flex;align-items:center;gap:6px;justify-content:center;margin:0 auto 10px;font-size:11.5px;color:#6b7280;background:#f7f8fa;border:1px dashed #d5dae2;border-radius:6px;padding:4px 10px;max-width:640px}
body.coldrag,body.coldrag *{cursor:col-resize!important;user-select:none!important}
body.dashview .layout{grid-template-columns:250px minmax(0,1fr)}
body.dashview.sidehid .layout{grid-template-columns:minmax(0,1fr)}
#printRoot{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .rpt{box-shadow:none;padding:0;display:block}
  #printRoot th{position:static}
  #printRoot thead{display:table-header-group}
  #printRoot tr{break-inside:avoid}
  #printRoot th,#printRoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:860px){.layout{grid-template-columns:1fr;overflow:auto}.side{max-height:45vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style>

$('btnMore').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  showMenu(r.right - 230, r.bottom + 4, [
    !isView() ? ['Sao chép cấu hình báo cáo', async () => { const ok = await copyText(JSON.stringify({ rs: VER, ...S.cfg })); toast(ok ? 'Đã chép cấu hình — dán sang extension / khối khác bằng "Dán cấu hình".' : 'Trình duyệt chặn sao chép.'); }] : null,
    !isView() ? ['Dán cấu hình báo cáo…', () => openModal('Dán cấu hình báo cáo', '<p class="hint">Dán đoạn cấu hình đã sao chép. Cột không có trong bảng hiện tại sẽ bị bỏ qua.</p><textarea id="pasteCfg" placeholder="{ … }"></textarea>', [['Áp dụng', () => { try { const o = JSON.parse($('pasteCfg').value); const src = S.cfg.src; S.cfg = fixCfg(o); S.cfg.src = src; initFv(); S.open = {}; S.selCol = -1; S.tgt = 'title'; closeModal(); changed(true); toast('Đã áp dụng cấu hình.'); } catch (x) { toast('Cấu hình không hợp lệ: ' + x.message, 6000); } }, 'primary']])] : null,
  ]);
};
// Khung chẩn đoán: chỉ mở bằng phím tắt Ctrl + Shift + D
function showDiag() { const t = JSON.stringify({ ver: VER, dash: S.dash, table: S.tableMeta && S.tableMeta.name, rows: S.rows.length, fields: S.fields.length, log: diag }, null, 1); openModal('Chẩn đoán', `<div id="probeOut" class="hint" style="margin-bottom:6px"></div><pre>${esc(t)}</pre>`, [['Thử đọc thẳng bảng', () => probeDirect()], ['Sao chép', async () => { const x = JSON.stringify({ ver: VER, dash: S.dash, table: S.tableMeta && S.tableMeta.name, rows: S.rows.length, fields: S.fields.length, log: diag }, null, 1); toast((await copyText(x)) ? 'Đã chép.' : 'Không chép được.'); }]]); }
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); showDiag(); } });

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
async function boot() {
  try {
    SDK = await import(SDK_URL); bitable = SDK.bitable; FieldType = SDK.FieldType; dashboard = SDK.dashboard || null; workspace = SDK.workspace || null;
    if (!bitable || !bitable.base) throw new Error('Không thấy ngữ cảnh Lark Base. Hãy mở trang này từ Base Extensions hoặc làm khối trong Dashboard / Base App.');
    setStatus('wait', 'Đang đọc Base…');
    const dm = await detectDashboard(); S.dash = dm; dlog('dashMode', dm);
    if (dm) { try { dashboard.setRendered(); } catch (e) {} }
    if (dm === 'View' || dm === 'FullScreen') { await bootView(); try { dashboard.onConfigChange(async () => { let ts = null; try { const c2 = await withTimeout(dashboard.getConfig(), 6000); ts = c2 && c2.customConfig && c2.customConfig.ts; } catch (e) {} if (ts && S.cfg && ts === S.cfg.__ts) { dlog('configChange', 'bỏ qua — cấu hình không đổi'); return; } await bootView(); }); } catch (e) {} return; }
    if (dm === 'Create' || dm === 'Config') { $('btnDashSave').hidden = false; $('packBox').hidden = false; $('modeTabs').querySelector('[data-m=view]').textContent = 'Xem thử'; }
    const tables = await useBase('');
    const dc = dm === 'Config' ? await getDashCfg() : null;
    if (dc) {
      if (dc.src && dc.src.baseToken && workspace) { try { await useBase(dc.src.baseToken); } catch (e) { dlog('reopen.base.error', String(e.message)); } }
      S.cfg = fixCfg(dc); S.cfg.src = Object.assign(defCfg().src, dc.src || {});
      if (!S.tables.some((t) => t.id === S.cfg.src.tableId)) { boxMsg('Không thấy bảng đã lưu trong khối (có thể đã bị xóa).', 'err'); S.cfg.src.tableId = ''; }
    }
    let tid = S.cfg && S.cfg.src.tableId;
    if (!tid) { try { const s = await withTimeout(bitable.base.getSelection(), 3000); if (s && tables.some((t) => t.id === s.tableId)) tid = s.tableId; } catch (e) {} }
    tid = tid || tables[0].id;
    await openTable(tid, !!(dc && S.cfg.src.tableId));
    if (workspace) listBases().then(async (bases) => {
      if (bases.length < 2) return; let cur = ''; try { const s = await withTimeout(bitable.base.getSelection(), 3000); cur = (s && (s.baseId || s.baseToken)) || ''; } catch (e) {}
      const me = bases.find((b) => b.token === cur);
      $('selBase').innerHTML = `<option value="">${esc((me && me.name) || 'Base đang mở')}</option>` + azSort(bases.filter((b) => b.token !== cur), (b) => b.name || b.token).map((b) => `<option value="${esc(b.token)}">${esc(b.name || b.token)}</option>`).join('');
      if (S.srcToken) $('selBase').value = S.srcToken; $('rowBase').hidden = false;
    }).catch(() => {});
  } catch (e) {
    dlog('boot.error', String(e && e.message || e)); setStatus('err', 'Chưa kết nối'); boxMsg('Không kết nối được: ' + (e && e.message || e), 'err');
    $('sheet').innerHTML = `<div class="empty">${esc(e && e.message || e)}</div>`;
  }
}
window.addEventListener('beforeunload', (e) => { if (isEdit() && dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', debounce(fixSticky, 150));
boot();
</script>
